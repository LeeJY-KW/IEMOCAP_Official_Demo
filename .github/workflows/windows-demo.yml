name: Windows demo verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-demo:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "0"
      PYTHONIOENCODING: "utf-8"
      JUPYTER_PREFER_ENV_PATH: "1"
    steps:
      - name: Check out the prepared package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.10 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          architecture: x64
      - name: Copy to a Korean path containing a space
        shell: python
        run: |
          from pathlib import Path
          import os, shutil
          root = Path(os.environ['RUNNER_TEMP']) / '공인시험 Windows' / 'IEMOCAP_Official_Demo'
          shutil.copytree('IEMOCAP_Official_Demo', root, ignore=shutil.ignore_patterns('results', '.venv', '__pycache__', '.ipynb_checkpoints'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'DEMO_ROOT={root}\n')
      - name: Create the project environment and install the unified requirements
        shell: pwsh
        run: |
          python -m venv "$env:DEMO_ROOT\.venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m pip install --upgrade pip==25.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m pip install -r "$env:DEMO_ROOT\requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m ipykernel install --sys-prefix --name python3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" "$env:DEMO_ROOT\code\run_demo.py" verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install browser validation tools
        shell: pwsh
        run: |
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m pip install playwright==1.65.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the notebook and Windows Edge playback check
        shell: pwsh
        run: |
          & "$env:DEMO_ROOT\.venv\Scripts\python.exe" .github/scripts/check_windows_delivery.py --package "$env:DEMO_ROOT" --output "$env:DEMO_ROOT\results\windows_validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-demo-validation
          path: ${{ env.DEMO_ROOT }}/results/
          if-no-files-found: warn
          retention-days: 7
